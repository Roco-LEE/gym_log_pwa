<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>헬스일지</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    /* 완전 검정 바탕(S9 AMOLED 배터리 절약) + 원판 주황 포인트. 초록은 '완료', 노랑은 '메모·경고' */
    --bg:#000; --card:#121212; --card2:#1c1c1c; --line:#2b2b2b;
    --fg:#f5f5f5; --dim:#9a9a9a; --acc:#ff7a1a; --on-acc:#1a0b00; --ok:#3ddc84; --warn:#ffd23f; --bad:#ff5c5c;
    --acc-tint:rgba(255,122,26,.12); --acc-line:rgba(255,122,26,.45);
    --warn-tint:rgba(255,210,63,.12); --warn-line:rgba(255,210,63,.35); --warn-flash:rgba(255,210,63,.30);
    --num:"Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  [data-hold]{touch-action:pan-y;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Malgun Gothic", sans-serif; overflow:hidden;}
  #app{height:100vh; height:100dvh; display:flex; flex-direction:column;}
  .top{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); flex:0 0 auto;}
  .top .t{font-size:18px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .top button{min-height:44px; min-width:44px;}
  .body{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px;}
  .foot{flex:0 0 auto; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg);}
  button{font:inherit; color:inherit; white-space:nowrap; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:17px; font-weight:600;}
  button:active{filter:brightness(1.3);}
  button.big{width:100%; padding:20px; font-size:22px; border-radius:18px;}
  .row > button.big{min-width:0; white-space:normal; font-size:18px; padding:16px 8px; line-height:1.25;}
  button.acc, button.ok{background:var(--acc); border-color:var(--acc); color:var(--on-acc);}
  button.warn{background:var(--warn); border-color:var(--warn); color:#321;}
  button.ghost{background:transparent;}
  button.sm{padding:8px 12px; font-size:14px; border-radius:10px;}
  button:disabled{opacity:.4;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;}
  .card.today{border-color:var(--acc-line);}
  .card .row:empty{display:none;}
  .row{display:flex; align-items:center; gap:10px;}
  .dim{color:var(--dim);} .small{font-size:13px;} .mt{margin-top:10px;}
  .list button{display:flex; width:100%; text-align:left; align-items:center; gap:10px; margin-bottom:8px; padding:16px 14px; font-size:19px;}
  .list button .n{flex:1;}
  .list button.done{opacity:.55;}
  .list button .chk{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .list button.done .chk{background:var(--ok); border-color:var(--ok); color:#062;}
  .list button.started{border-color:var(--acc); background:var(--card2);}
  .list button.started .chk{border-color:var(--acc); color:var(--acc); font-size:22px;}

  /* 운동 화면 */
  .exname{font-size:28px; font-weight:800; line-height:1.15;}
  /* 운동 화면 정보 줄: 평소엔 두 줄로 접고, 누르면 펼침 */
  .info{margin-top:6px; padding:8px 10px; border-radius:12px; background:var(--card); font-size:15px; color:var(--dim); position:relative;}
  .info b{color:var(--fg); font-weight:700;}
  .info .l1, .info .l2{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:18px;}
  .info .l2{font-size:13px; color:var(--warn); margin-top:2px;}
  .info .chev{position:absolute; right:10px; top:9px; color:var(--dim); font-size:13px;}
  .info.open .l1, .info.open .l2{white-space:normal;}
  .info .pin, .info .plan{margin-top:6px;}
  .info .last{margin-top:6px; font-size:14px;}
  .last{margin-top:6px; font-size:15px; color:var(--dim);}
  .plan{margin-top:8px; font-size:15px; color:var(--acc); background:var(--acc-tint); border:1px solid var(--acc-line); border-radius:12px; padding:8px 10px;}
  .plan b{color:var(--fg); font-weight:700;}
  .plan .pnote{color:var(--dim); font-size:13px; margin-top:3px; line-height:1.4;}
  .pin{margin-top:6px; font-size:14px; color:var(--warn); background:var(--warn-tint); border:1px solid var(--warn-line); border-radius:10px; padding:6px 9px; line-height:1.4; white-space:pre-wrap;}
  .last b{color:var(--fg); font-weight:600;}
  .sets{margin-top:12px;}
  .set{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; border:2px solid transparent; background:var(--card); margin-bottom:8px;}
  .set.sel{border-color:var(--acc); background:var(--card2);}
  .set.done{opacity:.6;}
  .set.done.sel{opacity:1;}
  .set .lab{width:36px; font-size:15px; font-weight:700; color:var(--dim);}
  .set .lab.w{color:var(--warn);}
  .set .v{flex:1; font-family:var(--num); font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-0.5px; line-height:1.1;}
  .set .v small{font-family:-apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size:15px; color:var(--dim); font-weight:600; margin:0 3px;}
  .set .plates{max-width:76px; font-size:13px; line-height:1.25; color:var(--warn); font-weight:700; text-align:right;}
  .set.sel .v .tap{border-bottom:2px dotted var(--dim); padding:0 1px;}
  .set .v input{width:3.6em; font-size:28px; font-weight:800; text-align:center; padding:2px; border-radius:10px; border:2px solid var(--acc); background:var(--bg); color:var(--fg); font-variant-numeric:tabular-nums;}
  .set .st{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800;}
  .set.done .st{background:var(--ok); border-color:var(--ok); color:#062;}
  .ctrl{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .stepper{background:var(--card); border-radius:16px; padding:8px; display:flex; flex-direction:column; gap:6px;}
  .stepper .lbl{display:flex; align-items:center; justify-content:space-between; min-height:44px; padding-left:4px; font-size:14px; color:var(--dim); font-weight:700;}
  .stepper .lbl button{min-height:44px; min-width:64px; padding:0 10px; font-size:15px; border-radius:10px; font-variant-numeric:tabular-nums;}
  .stepper .bt{display:flex; gap:8px;}
  .stepper .bt button{flex:1; font-size:32px; height:56px; padding:0; border-radius:12px; line-height:1;}
  .stepgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .stepgrid button{height:56px; font-size:18px; font-variant-numeric:tabular-nums;}
  .nstep{display:flex; gap:6px; align-items:center; margin-top:4px;}
  .nstep button{flex:0 0 44px; height:46px; padding:0; font-size:24px; border-radius:12px; line-height:1;}
  .nstep input{flex:1; min-width:0; text-align:center; font-family:var(--num); font-size:24px; font-weight:700; padding:8px 4px; font-variant-numeric:tabular-nums;}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  button.pick{font-size:16px; padding:0 14px; height:46px; line-height:46px; display:inline-flex; align-items:center;}
  button.pick.on{background:var(--acc); border-color:var(--acc); color:var(--on-acc);}
  button.pick.in{opacity:.5;}
  button.sm.ok{font-size:14px;}
  .restbar{display:flex; align-items:center; gap:8px; margin-bottom:10px; padding:6px 6px 6px 14px; border-radius:16px; background:var(--card2); border:1px solid var(--line); position:relative; overflow:hidden;}
  .restbar .prog{position:absolute; left:0; bottom:0; height:3px; background:var(--acc); transition:width .25s linear;}
  .restbar .lab{font-size:14px; color:var(--dim); font-weight:700;}
  .restbar .n{flex:1; font-family:var(--num); font-size:46px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.05;}
  .restbar button{min-width:52px; height:48px; padding:0 8px; font-size:15px; border-radius:12px;}
  .restbar.soon{border-color:var(--warn); animation:blink 1s steps(2, jump-none) infinite;}
  .restbar.soon .n{color:var(--warn);}
  @keyframes blink{0%{background:var(--warn-flash);}100%{background:var(--card2);}}
  @media (prefers-reduced-motion: reduce){ .restbar.soon{animation:none; background:var(--warn-tint);} }
  .restbar.over{background:var(--warn-tint); border-color:var(--warn);}
  .restbar.over .n, .restbar.over .lab{color:var(--warn);}
  .restbar.over .prog{background:var(--warn);}
  .restbar .n, .restbar .lab{cursor:pointer;}
  /* 세트 끝나면 뜨는 큰 휴식 화면. 벤치에 폰을 놓고도 읽히게 크게, 다음 세트는 여기서 바로 고침 */
  .restfull{position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px 16px calc(20px + env(safe-area-inset-bottom));}
  .restfull .lab{font-size:18px; color:var(--dim); font-weight:700;}
  .restfull .n{font-family:var(--num); font-size:132px; font-weight:700; line-height:.95; font-variant-numeric:tabular-nums;}
  .restfull .track{width:100%; height:6px; border-radius:3px; background:var(--card2); position:relative; overflow:hidden;}
  .restfull .prog{position:absolute; left:0; top:0; bottom:0; background:var(--acc); transition:width .25s linear;}
  .restfull .adj{display:flex; gap:10px;}
  .restfull .adj button{min-width:96px; height:48px; font-size:16px;}
  .restfull .next{width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px;}
  .restfull .next .t{font-size:14px; color:var(--dim); font-weight:700; margin:0 4px 8px;}
  .restfull .next .t b{color:var(--warn);}
  .restfull .next .g{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .restfull .next .cell{display:flex; align-items:center; gap:4px;}
  .restfull .next .cell button{flex:0 0 46px; height:54px; padding:0; font-size:26px;}
  .restfull .next .cell .v{flex:1; text-align:center; font-family:var(--num); font-size:34px; font-weight:700; font-variant-numeric:tabular-nums;}
  .restfull .next .cell .v small{font-family:-apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; font-size:13px; color:var(--dim); margin-left:2px;}
  .restfull .acts{display:flex; gap:10px; width:100%;}
  .restfull .acts button{flex:1; height:60px; font-size:18px; white-space:normal;}
  .restfull.soon{animation:blinkfull 1s steps(2, jump-none) infinite;}
  @keyframes blinkfull{0%{background:var(--warn-flash);}100%{background:var(--bg);}}
  @media (prefers-reduced-motion: reduce){ .restfull.soon{animation:none; background:var(--warn-tint);} }
  .restfull.soon .n, .restfull.over .n, .restfull.over .lab{color:var(--warn);}
  .restfull.over .prog{background:var(--warn);}
  .hidden{display:none !important;}
  .hist{font-size:14px; color:var(--dim); margin-top:8px; line-height:1.6;}
  .hist b{color:var(--fg); font-weight:600;}
  .pill{display:inline-block; padding:2px 8px; border-radius:10px; background:var(--card2); font-size:12px; color:var(--dim); margin-right:4px;}
  input[type=text], input[type=number], input[type=date], select, textarea{font:inherit; color:inherit; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px; width:100%; font-size:17px;}
  textarea{min-height:60px; user-select:text; -webkit-user-select:text;}
  h3{margin:18px 0 8px; font-size:15px; color:var(--dim); font-weight:700;}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:40; display:flex; align-items:flex-end;}
  .modal .box{background:var(--card); width:100%; max-height:90vh; max-height:90dvh; display:flex; flex-direction:column; border-radius:20px 20px 0 0;}
  .modal .mhead{flex:0 0 auto; padding:14px 14px 6px;}
  .modal .mbody{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 14px;}
  .modal .mfoot{flex:0 0 auto; display:flex; gap:8px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);}
  .modal .mfoot button{flex:1; padding:16px; font-size:18px;}
  .sess{display:flex; gap:10px; align-items:center; padding:12px; background:var(--card); border-radius:14px; margin-bottom:8px;}
  .sess .d{font-weight:700; font-size:17px; width:80px; flex:0 0 auto;}
  .sess .s{flex:1; color:var(--dim); font-size:14px; line-height:1.4;}
  .toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 18px; border-radius:20px; font-weight:700; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
/* ===================== 기본 데이터 (헬스일지.xlsx 에서 가져옴) ===================== */
const DEFAULT_EXERCISES = [{"n": "랫풀다운", "p": "등", "t": "머신", "step": 3.75, "rep": "10-15"}, {"n": "체스트프레스", "p": "가슴", "t": "머신", "step": 3.75, "rep": "10-15"}, {"n": "시티드로우", "p": "등", "t": "머신", "step": 3.75, "rep": "10-15"}, {"n": "레그프레스(핀)", "p": "하체", "t": "머신", "step": 7.5, "rep": "10-15"}, {"n": "레그프레스(원판)", "p": "하체", "t": "프리웨이트", "step": 10, "rep": "10-15"}, {"n": "레그익스텐션", "p": "하체", "t": "머신", "step": 3.75, "rep": "12-15"}, {"n": "숄더프레스", "p": "어깨", "t": "머신", "step": 2.5, "rep": "10-15"}, {"n": "레그컬", "p": "하체", "t": "머신", "step": 7.5, "rep": "10-15"}, {"n": "인클라인 체스트프레스", "p": "가슴", "t": "머신", "step": 5, "rep": "10-15"}, {"n": "펙덱 플라이", "p": "가슴", "t": "머신", "step": 5, "rep": "12-15"}, {"n": "벤치프레스", "p": "가슴", "t": "프리웨이트", "step": 2.5, "rep": "6-10"}, {"n": "인클라인 덤벨프레스", "p": "가슴", "t": "프리웨이트", "step": 2, "rep": "8-12"}, {"n": "턱걸이(보조)", "p": "등", "t": "보조머신", "step": 5, "rep": "6-12"}, {"n": "턱걸이", "p": "등", "t": "맨몸", "step": 2.5, "rep": "5-10"}, {"n": "딥스(보조)", "p": "팔", "t": "보조머신", "step": 5, "rep": "8-12"}, {"n": "케이블 로우", "p": "등", "t": "케이블", "step": 5, "rep": "10-15"}, {"n": "덤벨 로우", "p": "등", "t": "프리웨이트", "step": 2, "rep": "8-12"}, {"n": "데드리프트", "p": "등", "t": "프리웨이트", "step": 5, "rep": "5-8"}, {"n": "루마니안 데드리프트", "p": "하체", "t": "프리웨이트", "step": 5, "rep": "8-12"}, {"n": "덤벨 숄더프레스", "p": "어깨", "t": "프리웨이트", "step": 2, "rep": "8-12"}, {"n": "사이드 레터럴 레이즈", "p": "어깨", "t": "덤벨", "step": 1, "rep": "12-20"}, {"n": "리어 델트 플라이", "p": "어깨", "t": "머신", "step": 5, "rep": "12-20"}, {"n": "바벨 컬", "p": "팔", "t": "프리웨이트", "step": 5, "rep": "8-12"}, {"n": "덤벨 컬", "p": "팔", "t": "덤벨", "step": 1, "rep": "10-15"}, {"n": "트라이셉스 푸시다운", "p": "팔", "t": "케이블", "step": 2.5, "rep": "10-15"}, {"n": "딥스", "p": "팔", "t": "맨몸", "step": 2.5, "rep": "6-12"}, {"n": "바벨 스쿼트", "p": "하체", "t": "프리웨이트", "step": 2.5, "rep": "6-10"}, {"n": "핵 스쿼트", "p": "하체", "t": "머신", "step": 10, "rep": "8-12"}, {"n": "힙 어브덕션", "p": "하체", "t": "머신", "step": 5, "rep": "12-20"}, {"n": "카프레이즈", "p": "하체", "t": "맨몸", "step": 2.5, "rep": "12-20"}, {"n": "백 익스텐션", "p": "코어", "t": "맨몸", "step": 2.5, "rep": "12-15"}, {"n": "행잉 레그레이즈", "p": "코어", "t": "맨몸", "step": 0, "rep": "8-15"}, {"n": "플랭크", "p": "코어", "t": "맨몸", "step": 0, "rep": "30-60초"}, {"n": "크런치", "p": "코어", "t": "머신", "step": 5, "rep": "12-20"}];




/* ===================== 저장소 ===================== */
// DB = { sessions:[{id,date,routine,start,end,entries:[{ex,warm:{kg,reps}|null,sets:[{kg,reps}],memo}]}],
//        exercises:[...], settings:{rest}, steps:{운동명:step} }
const KEY = "gymlog.v1", CUR = "gymlog.cur";
let DB = load(KEY) || null;
if (!DB) {
  DB = { sessions: [], exercises: DEFAULT_EXERCISES.slice(), settings: { rest: 90 }, steps: {}, synced: [] };
  save();
  // seed.json 이 서버에 있으면(엑셀에서 옮겨온 과거 기록) 첫 실행 때 한 번만 들여옴. 없으면 그냥 빈 상태로 시작.
  // 형식: {"rows":[[날짜, 운동, 워밍업kg, 회, 1세트kg, 회, ... 6세트kg, 회, 메모], ...]}
  fetch("seed.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.rows || !j.rows.length) return;
    const byDate = {};
    for (const r of j.rows) {
      const [d, ex, wk, wr, ...rest] = r; const memo = rest.pop();
      const sets = [];
      for (let i = 0; i < 12; i += 2) if (rest[i] != null) sets.push({ kg: rest[i], reps: rest[i + 1] });
      (byDate[d] = byDate[d] || []).push({ ex, warm: wk != null ? { kg: wk, reps: wr } : null, sets, memo: memo || "" });
    }
    for (const d of Object.keys(byDate).sort())
      DB.sessions.push({ id: "seed-" + d, date: d, routine: "excel", start: null, end: null, entries: byDate[d], fromExcel: true });
    save(); render(); toast(`엑셀 기록 ${j.rows.length}줄 가져옴`);
  }).catch(() => { });
}
// 운동 이름 정리. 엑셀 [기록]이 기준.
//  · 9/18 이전 '레그프레스' = 레그익스텐션 (엑셀에서 정정됨)
//  · 9/23 = Lexco 원판 슬레드, 9/25·9/28·10/01 = 핀 머신
//  · 그 밖의 날짜에 남은 '레그프레스'(메모·증량 단위 포함)는 지금 하는 핀 머신으로
const LEG_PRESS_BY_DATE = {
  "2026-09-23": "레그프레스(원판)",
  "2026-09-25": "레그프레스(핀)", "2026-09-28": "레그프레스(핀)", "2026-10-01": "레그프레스(핀)",
};

function makeEntry(ex, plannedSets, rest, plan) {
  const hs = exHistory(ex), last = hs[0];
  const rows = [];
  if (plan && plan.warm === false) { /* 계획에서 워밍업 없음으로 정함 */ }
  else if (plan && plan.warm) rows.push(row("W", plan.warm.kg, plan.warm.reps));
  else if (last && last.warm) rows.push(row("W", last.warm.kg, last.warm.reps));
  else if (!last && exInfo(ex).t !== "보조머신" && exInfo(ex).t !== "맨몸") rows.push(row("W", 0, 10));
  const n = Math.max(plannedSets || 0, plan ? 0 : (last ? last.sets.length : 0), 1);
  for (let i = 0; i < n; i++) {
    const src = last ? (last.sets[i] || last.sets[last.sets.length - 1]) : { kg: 0, reps: 10 };
    // 계획에 무게가 없으면("가볍게" 같은 경우) 지난 기록을 그대로 씀
    const kg = plan && plan.kg != null ? plan.kg : src.kg;
    const reps = plan && plan.reps != null ? plan.reps : src.reps;
    rows.push(row(i + 1, kg, reps));
  }
  return { ex, rest: rest || DB.settings.rest, rows, memo: "", plan: plan || null };

function pickExercise(afterExercise) {

// 운동에 영구히 붙는 메모. 머신 번호·시트 높이·자세 주의점 등, 다음에도 계속 보임
function exMemo(ex) { return (DB.exMemo || {})[ex] || ""; }
function setExMemo(ex, txt) {
  DB.exMemo = DB.exMemo || {};
  txt = (txt || "").trim();
  if (txt) DB.exMemo[ex] = txt; else delete DB.exMemo[ex];
  save();
}
function curStep(ex) { return DB.steps[ex] || exInfo(ex).step || 2.5; }
let infoOpen = false;   // 운동 화면 정보 줄 펼침 여부
function renderExercise() {
  keepAwake(true);
  const e = cur.entries[exIdx], info = exInfo(e.ex), hs = exHistory(e.ex), last = hs[0], best = bestKg(e.ex);
  const r = e.rows[sel];
  const allDone = e.rows.every(x => x.done);

  const lastTxt = last ? `지난번 ${md(last.date)} <b>${setsText(last)}</b>` : "첫 기록";
  const notes = [exMemo(e.ex) && "📌 " + exMemo(e.ex), e.plan && e.plan.note].filter(Boolean);
  const pills = `${best != null ? `<span class="pill">최고 ${fmt(best)}kg</span>` : ""}${info.rep ? `<span class="pill">목표 ${info.rep}회</span>` : ""}`;
  // 접힘: 🎯 목표(없으면 지난번) 한 줄 + 메모 한 줄 / 펼침: 메모·계획·지난번 전부
  const infoHtml = infoOpen
    ? `<div class="info open" onclick="infoOpen=false;renderExercise()"><span class="chev">접기 ▴</span>
        ${exMemo(e.ex) ? `<div class="pin" onclick="event.stopPropagation();exMenu()">📌 ${esc(exMemo(e.ex))}</div>` : ""}
        ${e.plan ? `<div class="plan">🎯 계획 <b>${planTargetText(e.plan)}</b>${e.plan.note ? `<div class="pnote">${esc(e.plan.note)}</div>` : ""}</div>` : ""}
        <div class="last">${lastTxt} ${pills}</div></div>`
    : `<div class="info" onclick="infoOpen=true;renderExercise()"><span class="chev">▾</span>
        <div class="l1">${e.plan ? `🎯 <b>${planTargetText(e.plan)}</b>` : lastTxt}</div>
        ${notes.length ? `<div class="l2">${esc(notes.join(" · "))}</div>` : ""}</div>`;
  // 선택된 세트는 숫자를 눌러 직접 입력, 다른 세트는 누르면 선택
  const num = (x, i, k) => {
    const v = k === "kg" ? `${fmt(x.kg)}<small>kg</small>` : `${x.reps}<small>회</small>`;
    return i === sel ? `<span class="tap" onclick="event.stopPropagation();typeVal('${k}')">${v}</span>` : v;
  };
  h(`
  <div class="top"><button class="sm ghost" onclick="go('session')">‹ 목록</button><div class="t">${exIdx + 1}/${cur.entries.length}</div>
    <button class="sm ghost" style="font-size:22px;padding:4px 16px" onclick="exMenu()">⋯</button></div>
  <div class="body" style="padding-bottom:8px">
    <div class="exname">${esc(e.ex)}</div>
    ${infoHtml}
    <div class="sets">
      ${e.rows.map((x, i) => `<div class="set ${i === sel ? "sel" : ""} ${x.done ? "done" : ""}" onclick="selectRow(${i})">

        <div class="v">${num(x, i, "kg")} ${num(x, i, "reps")}</div>
        ${i === sel && plateText(e.ex, x.kg) ? `<div class="plates">${plateText(e.ex, x.kg)}</div>` : ""}
        <div class="st">${x.done ? "✓" : ""}</div></div>`).join("")}
      <button class="ghost" style="width:100%;border-style:dashed;min-height:44px" onclick="addRow()">＋ 세트</button>
    </div>
  </div>
  <div class="foot">
    ${restBar()}
    <div class="ctrl">
      <div class="stepper">
        <div class="lbl">무게<button onclick="pickStep()">±${fmt(step)}</button></div>
        <div class="bt"><button onclick="adj('kg',-1)">−</button><button onclick="adj('kg',1)">＋</button></div>
      </div>
      <div class="stepper">
        <div class="lbl">횟수</div>
        <div class="bt"><button onclick="adj('reps',-1)">−</button><button onclick="adj('reps',1)">＋</button></div>
      </div>
    </div>
    ${allDone
      ? `<div class="row"><button class="big" style="flex:1" onclick="addRow()">＋ 한 세트 더</button><button class="big acc" style="flex:1.3" onclick="nextExercise()">${exIdx + 1 < cur.entries.length ? "다음 운동 →" : "운동 고르기 →"}</button></div>`
      : `<div class="row"><button class="big ghost" style="flex:0 0 auto;width:auto;padding:20px 14px;font-size:16px" onclick="endExercise()">이 운동<br>끝</button><button class="big ok" style="flex:1" onclick="completeSet()">${r.done ? "수정 완료" : (r.type === "W" ? "워밍업 완료 ✓" : r.type + "세트 완료 ✓")}</button></div>`}
  </div>
  ${restFull()}`);
  tickRest();
}
// 원판을 양쪽에 끼우는 운동: 기록한 무게에서 바 무게를 빼고 반으로 나눠 한쪽 원판 조합을 보여줌.
// 레그프레스(원판)은 원판 무게만 기록하므로 바 0. 바벨 컬은 고정 바벨(10·15·20…)이라 대상 아님.
const PLATE_EX = { "레그프레스(원판)": 0, "벤치프레스": 20, "바벨 스쿼트": 20, "데드리프트": 20, "루마니안 데드리프트": 20 };
const PLATES = [20, 15, 10, 5, 2.5, 1.25];
function plateText(ex, kg) {
  if (!(ex in PLATE_EX)) return "";
  let side = (kg - PLATE_EX[ex]) / 2;
  if (side <= 0) return PLATE_EX[ex] ? "빈 바" : "";
  const out = [];
  for (const pl of PLATES) while (side >= pl - 1e-9) { out.push(pl); side -= pl; }
  return "한쪽 " + out.map(fmt).join("+") + (side > 0.01 ? ` +${fmt(side)}` : "");
}
// 무게 증감 단위 고르기 (운동별로 기억)
function pickStep() {
  const e = cur.entries[exIdx], cs = curStep(e.ex);
  openModal(`<div class="stepgrid">${[1, 1.25, 2, 2.5, 3.75, 5, 10].map(v => `<button class="${v === cs ? "acc" : ""}" onclick="setStep(${v});closeModal()">±${v}</button>`).join("")}</div>
    <div class="dim small mt">이 운동에서만 바뀌고, 다음에도 기억해요</div>`,
    { head: `<div style="font-size:18px;font-weight:700">무게 증감 단위</div><div class="dim small">${esc(e.ex)}</div>` });
}
function selectRow(i) { sel = i; renderExercise(); }
function adj(k, d) {
  const e = cur.entries[exIdx], r = e.rows[sel];
  if (k === "kg") r.kg = Math.max(0, Math.round((r.kg + d * curStep(e.ex)) * 100) / 100);
  else r.reps = Math.max(0, r.reps + d);
  saveCur(); renderExercise();
}
// 선택된 세트의 숫자를 누르면 그 자리가 입력칸으로 바뀜. 입력 끝나면(엔터/포커스 아웃) 반영
function typeVal(k) {
  const e = cur.entries[exIdx], r = e.rows[sel];
  const box = event.currentTarget;
  box.innerHTML = `<input type="number" inputmode="decimal" step="${k === "kg" ? "0.25" : "1"}" min="0" value="${k === "kg" ? fmt(r.kg) : r.reps}">`;
  const inp = box.firstChild; inp.focus(); inp.select();
  const done = () => {
    const v = parseFloat(inp.value);
    if (!isNaN(v) && v >= 0) { if (k === "kg") r.kg = Math.round(v * 100) / 100; else r.reps = Math.round(v); saveCur(); }
    renderExercise();
  };
  inp.addEventListener("blur", done);
  inp.addEventListener("keydown", ev => { if (ev.key === "Enter") inp.blur(); });
}
function setStep(s) { DB.steps[cur.entries[exIdx].ex] = s; save(); renderExercise(); }
function copyPrev() {
  const e = cur.entries[exIdx]; if (sel === 0) return;
  const p = e.rows[sel - 1]; e.rows[sel].kg = p.kg; e.rows[sel].reps = p.reps; saveCur(); renderExercise();
}
function addRow() {
  const e = cur.entries[exIdx], lastRow = e.rows[e.rows.length - 1];
  const n = e.rows.filter(x => x.type !== "W").length + 1;
  e.rows.push(row(n, lastRow.kg, lastRow.reps));
  sel = e.rows.length - 1; saveCur(); renderExercise();
}
function completeSet() {
  const e = cur.entries[exIdx], r = e.rows[sel];
  const wasDone = r.done; r.done = true;
  if (!wasDone) cur.lastDone = Date.now();
  // 다음 미완료 세트로 이동하면서 방금 한 값을 기본값으로
  const next = e.rows.findIndex((x, i) => i > sel && !x.done);
  if (!wasDone && next >= 0) {
    const n = e.rows[next];
    // 본세트에서 무게/횟수를 지난번과 다르게 바꿨으면 다음 세트도 그 값으로 (워밍업은 제외)
    if (r.type !== "W" && (r.kg !== r.pre.kg || r.reps !== r.pre.reps)) { n.kg = r.kg; n.reps = r.reps; }
    sel = next;
  } else if (next < 0) { const any = e.rows.findIndex(x => !x.done); sel = any >= 0 ? any : sel; }
  saveCur(); vibrate(30);
  if (!wasDone) startRest(e.rest || DB.settings.rest); else renderExercise();
}
// 안 한 세트는 버리고 이 운동을 마침 (세트 수를 미리 정하지 않아도 되게)
function endExercise() {
  const e = cur.entries[exIdx];
  const doneRows = e.rows.filter(x => x.done);
  if (!doneRows.length) { if (!confirm("완료한 세트가 없어요. 이 운동을 오늘 목록에서 뺄까요?")) return; cur.entries.splice(exIdx, 1); saveCur(); return go("session"); }
  e.rows = doneRows; saveCur();
  nextExercise();
}
function nextExercise() {
  if (exIdx + 1 < cur.entries.length) openExercise(exIdx + 1);
  else { go("session"); pickExercise(true); }
}
function exMenu() {
  const e = cur.entries[exIdx], hs = exHistory(e.ex).slice(0, 5);
  openModal(`${e.plan ? `<div class="plan" style="margin:4px 0 0">🎯 계획 <b>${planTargetText(e.plan)}</b>${e.plan.note ? `<div class="pnote">${esc(e.plan.note)}</div>` : ""}</div>` : ""}
    <h3>최근 기록</h3><div class="hist">${hs.map(x => `${md(x.date)} <b>${setsText(x)}</b>`).join("<br>") || "없음"}</div>
    <h3>📌 이 운동 메모 <span class="dim" style="font-weight:500">· 다음에도 계속 보임</span></h3>
    <textarea id="exmemo" placeholder="머신 번호, 시트 높이, 자세 주의점 …">${esc(exMemo(e.ex))}</textarea>
    <h3>오늘 메모 <span class="dim" style="font-weight:500">· 이번 기록에만</span></h3>

    <div class="row mt"><button class="acc" style="flex:1" onclick="saveMemo()">메모 저장</button></div>
    <h3>세트</h3>
    <div class="row" style="flex-wrap:wrap"><button style="flex:1 1 45%" onclick="closeModal();copyPrev()">위 세트 값 복사</button><button style="flex:1 1 45%" onclick="resetRow()">완료 취소</button><button style="flex:1 1 100%" onclick="removeRow()">선택한 세트 삭제</button></div>
    <h3>운동</h3>
    <div class="row"><button style="flex:1;color:var(--bad)" onclick="removeExercise()">이 운동 오늘 빼기</button></div>`,

}
function saveMemo() {
  const e = cur.entries[exIdx];

  setExMemo(e.ex, $("#exmemo").value);
  saveCur(); closeModal(); toast("저장"); renderExercise();
}
function removeRow() {
  const e = cur.entries[exIdx]; if (e.rows.length <= 1) return;
  e.rows.splice(sel, 1);
  let n = 1; for (const x of e.rows) if (x.type !== "W") x.type = n++;
  sel = Math.min(sel, e.rows.length - 1); saveCur(); closeModal(); renderExercise();
}
function resetRow() { cur.entries[exIdx].rows[sel].done = false; saveCur(); closeModal(); renderExercise(); }
function removeExercise() {
  cur.entries.splice(exIdx, 1); saveCur(); closeModal(); go("session");
}

/* ===================== 휴식 타이머 ===================== */
// 화면을 덮지 않고 하단에 띠로 보임 → 쉬는 동안 다음 세트 무게를 바로 바꿀 수 있음.
// 다른 운동·목록으로 넘어가도 계속 돌고, 끝나면 진동+소리.
// restMode: "full" = 큰 휴식 화면 / "mini" = 하단 띠 (줄이기 누르면)
let restT = null, restEnd = null, restTotal = 0, restFired = false, restMode = "full";
function startRest(sec) {
  restEnd = Date.now() + sec * 1000; restTotal = sec * 1000; restFired = false; restMode = "full";
  renderExercise();
}
function restMin() { restMode = "mini"; render(); }
function restOpen() {
  restMode = "full";
  if (view !== "exercise" && cur && cur.entries[exIdx]) go("exercise"); else render();
}
function restAdd(s) { if (!restEnd) return; restEnd += s * 1000; restTotal = Math.max(1000, restTotal + s * 1000); restFired = restEnd <= Date.now(); tickRest(); }
function endRest() { restEnd = null; clearInterval(restT); restT = null; render(); }
function mmss(sec) { const a = Math.abs(sec); return `${Math.floor(a / 60)}:${String(a % 60).padStart(2, "0")}`; }
function restBar() {
  if (!restEnd || !cur || (restMode === "full" && view === "exercise")) return "";
  return `<div class="restbar" id="rest"><span class="lab" onclick="restOpen()">휴식</span><span class="n" id="restN" onclick="restOpen()"></span>
    <button onclick="restAdd(-15)">−15</button><button onclick="restAdd(15)">＋15</button><button onclick="endRest()" aria-label="휴식 끝">✕</button>
    <div class="prog" id="restP"></div></div>`;
}
function restFull() {
  if (!restEnd || !cur || restMode !== "full" || view !== "exercise") return "";
  const e = cur.entries[exIdx], r = e.rows[sel], done = e.rows.every(x => x.done);
  const pl = !done && plateText(e.ex, r.kg);
  const middle = done
    ? `<div class="acts"><button onclick="restMin();addRow()">＋ 한 세트 더</button><button class="acc" onclick="restMin();nextExercise()">${exIdx + 1 < cur.entries.length ? "다음 운동" : "운동 고르기"}</button></div>`
    : `<div class="next"><div class="t">다음 · ${r.type === "W" ? "워밍업" : r.type + "세트"}${pl ? ` · <b>${pl}</b>` : ""}</div><div class="g">
        <div class="cell"><button onclick="adj('kg',-1)">−</button><div class="v">${fmt(r.kg)}<small>kg</small></div><button onclick="adj('kg',1)">＋</button></div>
        <div class="cell"><button onclick="adj('reps',-1)">−</button><div class="v">${r.reps}<small>회</small></div><button onclick="adj('reps',1)">＋</button></div></div></div>`;
  return `<div class="restfull" id="rest"><div class="lab">휴식</div><div class="n" id="restN"></div>
    <div class="track"><div class="prog" id="restP"></div></div>
    <div class="adj"><button onclick="restAdd(-15)">−15초</button><button onclick="restAdd(15)">＋15초</button></div>
    ${middle}
    <div class="acts"><button onclick="restMin()">줄이기</button><button class="${done ? "" : "acc"}" onclick="endRest()">${done ? "타이머 닫기" : "건너뛰기"}</button></div></div>`;
}
function tickRest() {
  clearInterval(restT); restT = null;
  if (!restEnd) return;
  const f = () => {
    if (!restEnd) return;
    const left = Math.ceil((restEnd - Date.now()) / 1000);
    if (left <= 0 && !restFired) { restFired = true; vibrate([300, 100, 300, 100, 300]); beep(3); }
    if (left < -300) return endRest();   // 5분 넘게 지나면 정리
    const bar = $("#rest"), n = $("#restN"), pr = $("#restP");
    if (!bar) return;
    n.textContent = left > 0 ? mmss(left) : "+" + mmss(-left);
    bar.classList.toggle("over", left <= 0);
    bar.classList.toggle("soon", left > 0 && left <= 10);   // 마지막 10초는 깜빡임
    pr.style.width = Math.max(0, Math.min(100, (restEnd - Date.now()) / restTotal * 100)) + "%";
  };
  f(); restT = setInterval(f, 250);
}

/* ===================== 계획 (plan.json) ===================== */
// PC 의 plan.json 을 온라인일 때 받아 폰에 저장. 헬스장에선 저장된 걸 그대로 씀.
// 형식: {"plans":[{"id","date","title","note","items":[{"ex","kg","reps","repsText","sets","rest","note"}]}]}
function fetchPlans() {
  return fetch("plan.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !Array.isArray(j.plans)) return;
    if (JSON.stringify(j.plans) === JSON.stringify(DB.plans || [])) return;
    DB.plans = j.plans; save();
    if (view === "home") renderHome();
  }).catch(() => { });
}
function donePlans() { return DB.donePlans || []; }
// 오늘 이후(또는 오늘) 계획 중 아직 안 한 것, 날짜 빠른 순
// 아직 안 한 계획을 오늘 / 다가오는 / 밀린(2주 이내) 으로 나눔
function plansOn(kind) {
  const t = today(), open = allPlans().filter(p => !donePlans().includes(p.id));
  if (kind === "today") return open.filter(p => p.date === t);
  if (kind === "upcoming") return open.filter(p => p.date > t).sort((a, b) => a.date < b.date ? -1 : 1);
  return open.filter(p => p.date < t && p.date >= addDays(-14)).sort((a, b) => a.date > b.date ? -1 : 1);
}
function openPlans() { return [...plansOn("today"), ...plansOn("upcoming")]; }
function daysAgo(d) { return Math.round((new Date(today()) - new Date(d)) / 86400000); }
function planToToday(id) { const p = (DB.myPlans || []).find(x => x.id === id); if (!p) return; p.date = today(); save(); toast("오늘로 옮김"); renderHome(); }
function hidePlan(id) { DB.donePlans = [...new Set([...donePlans(), id])]; save(); renderHome(); }
// PC plan.json 계획(DB.plans) + 폰에서 만든 계획(DB.myPlans)
function allPlans() { return [...(DB.plans || []), ...(DB.myPlans || [])]; }
function planById(id) { return allPlans().find(p => p.id === id); }
function startPlan(id) {
  const p = planById(id); if (!p) return;
  cur = { id: "s-" + Date.now(), date: today(), routine: p.title || "계획", planId: p.id, start: Date.now(),
          entries: p.items.map(it => makeEntry(it.ex, it.sets, it.rest, it)) };
  saveCur(); exIdx = 0; go("session");
}
// mode: today(주인공) / upcoming(다가오는) / overdue(밀린)
function planCard(p, mode = "today") {
  const mine = p.id.startsWith("my-");
  const when = mode === "overdue" ? `<span style="color:var(--warn)">${md(p.date)} · ${daysAgo(p.date)}일 지남</span>` : p.date === today() ? "오늘" : md(p.date);
  return `<div class="card${mode === "today" ? " today" : ""}">
    <div style="font-weight:700;font-size:17px">📋 ${esc(p.title || md(p.date) + " 계획")}</div>
    <div class="dim small">${when} · ${p.items.length}개 운동${mine ? "" : " · PC에서 받은 계획"}</div>
    ${p.note ? `<div class="dim small mt">${esc(p.note)}</div>` : ""}
    <div class="hist">${p.items.map(it => `${esc(it.ex)} <b>${planTargetText(it)}</b>`).join("<br>")}</div>
    <button class="big ${mode === "today" ? "acc" : ""} mt" onclick="startPlan('${p.id}')">이 계획으로 시작</button>
    <div class="row mt" style="gap:8px">
      ${mode === "overdue" && mine ? `<button style="flex:1" onclick="planToToday('${p.id}')">오늘로 옮기기</button>` : ""}
      ${mine ? `<button style="flex:1" onclick="editPlan('${p.id}')">수정</button>` : ""}
      ${mode === "overdue" ? `<button style="flex:1;color:var(--dim)" onclick="hidePlan('${p.id}')">숨기기</button>`
        : mine ? `<button style="flex:1;color:var(--bad)" onclick="deletePlan('${p.id}')">삭제</button>` : ""}
    </div>
  </div>`;
}

/* ===================== 계획 만들기 (폰에서) ===================== */
let pe = null;   // 편집 중인 계획
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function topSet(sets) { return sets.reduce((a, b) => b.kg > a.kg ? b : a); }
// 지난번 기록(제일 무거운 세트 · 세트 수)을 기본값으로
function planItemFromHistory(ex) {
  const last = exHistory(ex)[0];
  if (!last || !last.sets.length) return { ex, kg: null, reps: 10, sets: 3, note: "" };
  const t = topSet(last.sets);
  return { ex, warm: last.warm ? { ...last.warm } : undefined, kg: t.kg, reps: t.reps, sets: last.sets.length, note: "" };
}
function newPlan(fromSessionId) {
  const s = fromSessionId && DB.sessions.find(x => x.id === fromSessionId);
  pe = { id: "my-" + Date.now(), date: addDays(1), title: "", note: "", items: [] };
  if (s) pe.items = s.entries.filter(e => e.sets.length).map(e => { const t = topSet(e.sets); return { ex: e.ex, warm: e.warm ? { ...e.warm } : undefined, kg: t.kg, reps: t.reps, sets: e.sets.length, note: "" }; });
  go("planEdit");
}
function editPlan(id) { const p = (DB.myPlans || []).find(x => x.id === id); if (!p) return; pe = JSON.parse(JSON.stringify(p)); go("planEdit"); }
function deletePlan(id) { if (!confirm("이 계획을 지울까요?")) return; DB.myPlans = (DB.myPlans || []).filter(p => p.id !== id); save(); renderHome(); }
function renderPlanEdit() {
  keepAwake(false);
  const isEdit = (DB.myPlans || []).some(p => p.id === pe.id);
  h(`
  <div class="top"><button class="sm ghost" onclick="pe=null;go('home')">‹ 취소</button><div class="t">계획 ${isEdit ? "수정" : "만들기"}</div></div>
  <div class="body">
    <h3 style="margin-top:0">날짜</h3>
    <div class="row" style="gap:6px">${[[0, "오늘"], [1, "내일"], [2, "모레"]].map(([n, l]) => `<button class="sm ${pe.date === addDays(n) ? "acc" : ""}" style="flex:1" onclick="pe.date='${addDays(n)}';renderPlanEdit()">${l}</button>`).join("")}
      <input type="date" value="${pe.date}" style="flex:1.7;padding:8px" onchange="if(this.value){pe.date=this.value;renderPlanEdit()}"></div>
    <h3>제목 · 메모 <span class="dim" style="font-weight:500">(선택)</span></h3>
    <input type="text" placeholder="${md(pe.date)} 계획" value="${esc(pe.title)}" oninput="pe.title=this.value">
    <textarea class="mt" placeholder="오늘의 주의점 (예: 허리 조심, 무게보다 자세)" oninput="pe.note=this.value">${esc(pe.note)}</textarea>
    <h3>운동 <span class="dim" style="font-weight:500">· 누르면 수정, 꾹 누르면 빼기</span></h3>
    <div class="list">${pe.items.map((it, i) => `<button data-hold="holdRemovePlanItem:${i}" onclick="editPlanItem(${i})">
      <span class="dim" style="width:18px">${i + 1}</span>
      <span class="n">${esc(it.ex)}<div class="dim small" style="font-weight:500">🎯 ${planTargetText(it)}${it.note ? " · " + esc(it.note) : ""}</div></span><span class="dim">›</span></button>`).join("")}</div>
    <button class="ghost" style="width:100%;border-style:dashed" onclick="pickExercise()">＋ 운동 추가</button>
  </div>
  <div class="foot"><button class="big ok" onclick="savePlan()" ${pe.items.length ? "" : "disabled"}>계획 저장</button></div>`);
}
function savePlan() {
  if (!pe || !pe.items.length) return;
  pe.title = pe.title.trim(); pe.note = pe.note.trim();
  DB.myPlans = (DB.myPlans || []).filter(p => p.id !== pe.id); DB.myPlans.push(pe);
  DB.donePlans = donePlans().filter(id => id !== pe.id);   // 다시 저장하면 또 할 수 있게
  save(); pe = null; toast("계획 저장됨"); go("home");
}
// 숫자 칸: 직접 타이핑도 되고 −/＋로도 바꿈
function numStep(id, val, step, opt = {}) {
  return `<div class="nstep"><button type="button" onclick="bump('${id}',${-step},${opt.min ?? 0})">−</button>
    <input type="number" inputmode="${opt.int ? "numeric" : "decimal"}" id="${id}" value="${val ?? ""}" placeholder="${opt.ph || ""}">
    <button type="button" onclick="bump('${id}',${step},${opt.min ?? 0})">＋</button></div>`;
}
function bump(id, d, min) {
  const inp = $("#" + id);
  const base = inp.value === "" ? parseFloat(inp.dataset.base || inp.placeholder) || 0 : parseFloat(inp.value) || 0;
  inp.value = Math.max(min, Math.round((base + d) * 100) / 100);
}
function editPlanItem(i) {
  const it = pe.items[i], last = exHistory(it.ex)[0], info = exInfo(it.ex), step = curStep(it.ex);
  // 워밍업: 계획에 정해져 있으면 그 값, 아니면 지난번 워밍업, 그것도 없으면 꺼둠
  const w = it.warm || (it.warm === undefined && last && last.warm) || null;
  const lastKg = last && last.sets.length ? topSet(last.sets).kg : "";
  openModal(`
    <div class="row" style="margin-top:4px"><div style="flex:1;font-weight:700">워밍업</div>
      <button type="button" class="sm ${w ? "acc" : ""}" id="wToggle" onclick="toggleWarm()">${w ? "있음" : "없음"}</button></div>
    <div id="warmBox" class="fgrid mt" style="${w ? "" : "display:none"}">
      <div><div class="dim small">무게 kg</div>${numStep("pwKg", w ? fmt(w.kg) : "", step)}</div>
      <div><div class="dim small">횟수</div>${numStep("pwReps", w ? w.reps : 10, 1, { int: 1, min: 1 })}</div>
    </div>
    <h3>본세트 <span class="dim" style="font-weight:500">· ±${fmt(step)}kg</span></h3>
    <div><div class="dim small">무게 kg <span style="font-weight:400">(비워두면 그날 지난번 무게)</span></div>${numStep("piKg", it.kg == null ? "" : fmt(it.kg), step, { ph: lastKg })}</div>
    <div class="fgrid mt">
      <div><div class="dim small">횟수</div>${numStep("piReps", it.reps, 1, { int: 1, min: 1 })}</div>
      <div><div class="dim small">세트</div>${numStep("piSets", it.sets, 1, { int: 1, min: 1 })}</div>
    </div>
    <h3>메모</h3><input type="text" id="piNote" placeholder="예) 얕게, 15회 되면 다음엔 +${fmt(step)}" value="${esc(it.note || "")}">
    <div class="row mt"><button style="flex:1" ${i === 0 ? "disabled" : ""} onclick="movePlanItem(${i},-1)">↑ 위로</button><button style="flex:1" ${i === pe.items.length - 1 ? "disabled" : ""} onclick="movePlanItem(${i},1)">↓ 아래로</button></div>
    <div class="row mt"><button style="flex:1;color:var(--bad)" onclick="pe.items.splice(${i},1);closeModal();renderPlanEdit()">이 운동 빼기</button></div>`,
    { head: `<div style="font-size:18px;font-weight:700">${esc(it.ex)}</div><div class="dim small">${last ? "지난번 " + md(last.date) + " " + setsText(last) : "첫 기록"}${info.rep ? " · 목표 " + info.rep + "회" : ""}</div>`,
      foot: `<button class="acc" style="flex:2" onclick="savePlanItem(${i})">확인</button>` });
}
function toggleWarm() {
  const box = $("#warmBox"), btn = $("#wToggle"), on = box.style.display === "none";
  box.style.display = on ? "" : "none"; btn.textContent = on ? "있음" : "없음"; btn.classList.toggle("acc", on);
}
function savePlanItem(i) {
  const it = pe.items[i];
  const kg = parseFloat($("#piKg").value), reps = parseInt($("#piReps").value), sets = parseInt($("#piSets").value);
  it.kg = isNaN(kg) ? null : Math.max(0, kg);
  if (!isNaN(reps) && reps !== it.reps) { it.reps = Math.max(1, reps); delete it.repsText; }
  if (!isNaN(sets)) it.sets = Math.max(1, sets);
  if ($("#warmBox").style.display === "none") it.warm = false;
  else it.warm = { kg: Math.max(0, parseFloat($("#pwKg").value) || 0), reps: Math.max(1, parseInt($("#pwReps").value) || 10) };
  it.note = $("#piNote").value.trim();
  closeModal(); renderPlanEdit();
}
function movePlanItem(i, d) { const [x] = pe.items.splice(i, 1); pe.items.splice(i + d, 0, x); closeModal(); renderPlanEdit(); }
function holdRemovePlanItem(i) {
  i = +i; if (!confirm(`"${pe.items[i].ex}" 을(를) 계획에서 뺄까요?`)) return;
  pe.items.splice(i, 1); renderPlanEdit();
}
function planTargetText(it) {
  const warm = it.warm ? `W ${fmt(it.warm.kg)}×${it.warm.reps} · ` : "";
  const w = it.kg == null ? "" : fmt(it.kg) + "kg × ";
  return `${warm}${w}${it.repsText || it.reps}회${it.sets ? " · " + it.sets + "세트" : ""}`;
}

/* ===================== 엑셀 → 폰 (받아오기) ===================== */
// PC 엑셀이 기준. 다른 곳에서 엑셀을 고쳐도(이름 정정·메모·유산소로 옮김 등) 폰이 따라가게 함.
//  · 운동목록은 엑셀 [운동목록] 그대로 (폰에서 직접 추가한 운동은 유지)
//  · 이미 엑셀로 보낸 기록·엑셀에서 온 기록은 엑셀 [기록] 내용으로 바꿈
//  · 아직 안 보낸 기록은 건드리지 않음
function pullExcel() {
  return fetch("api/excel", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !Array.isArray(j.records) || !j.records.length) return;
    if (applyExcel(j) && (view === "home" || view === "detail")) render();
  }).catch(() => { });
}
function applyExcel(j) {
  const before = JSON.stringify([DB.sessions, DB.exercises]);
  if (Array.isArray(j.exercises) && j.exercises.length) { DB.xlExercises = j.exercises; syncExerciseList(); }
  const byDate = {};
  for (const r of j.records) (byDate[r.date] = byDate[r.date] || []).push(r);
  const synced = new Set(DB.synced || []);
  const isOld = s => s.fromExcel || synced.has(s.id);
  const prevByDate = {};
  for (const s of DB.sessions) if (isOld(s) && !prevByDate[s.date]) prevByDate[s.date] = s;
  const next = DB.sessions.filter(s => !isOld(s));           // 아직 안 보낸 건 그대로
  for (const d of Object.keys(byDate).sort()) {
    const rows = byDate[d], prev = prevByDate[d];
    const t = rows.find(r => r.start && r.end);
    // 폰에서 적은 '오늘 메모'는 엑셀 첫 줄에 [오늘] … 로 붙어 있으니 다시 떼어냄
    const dayMemo = prev ? prev.memo || "" : "";
    const tag = dayMemo ? "[오늘] " + dayMemo.replace(/\n/g, " ") : "";
    next.push({
      id: prev ? prev.id : "xl-" + d, date: d, routine: prev ? prev.routine : "excel",
      start: t ? t.start : prev ? prev.start : null, end: t ? t.end : prev ? prev.end : null,
      memo: dayMemo, fromExcel: prev ? !!prev.fromExcel : true,   // 엑셀에서만 온 기록은 계속 '엑셀 것'으로 (다시 보내지 않게)
      entries: rows.map(r => ({ ex: r.ex, warm: r.warm, sets: r.sets,
        memo: tag && r.memo.startsWith(tag) ? r.memo.slice(tag.length).replace(/^ · /, "") : r.memo })),
    });
  }
  DB.sessions = next;
  const changed = JSON.stringify([DB.sessions, DB.exercises]) !== before;
  if (changed) save();
  return changed;
}

/* ===================== PC 엑셀 동기화 ===================== */
function unsynced() { return DB.sessions.filter(s => !s.fromExcel && !(DB.synced || []).includes(s.id)); }
function unsyncedCount() { return unsynced().length; }
function hasExMemo() { return Object.keys(DB.exMemo || {}).length > 0; }
async function syncNow() {
  const btn = $("#syncBtn"); if (btn) { btn.disabled = true; btn.textContent = "보내는 중"; }
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch("api/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessions: unsynced(), exMemo: DB.exMemo || {} }), signal: ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("서버 오류 " + r.status));
    if (!j.test) { DB.synced = [...new Set([...(DB.synced || []), ...(j.written || [])])]; save(); await pullExcel(); }
    toast(j.rows ? `${j.target || "엑셀"}에 ${j.rows}줄 추가됨${j.test ? " (테스트)" : ""}` : "새로 보낼 게 없음"); renderHome();
    if (j.test) { const b = $("#syncBtn"); if (b) { b.disabled = false; b.textContent = "동기화"; } }
  } catch (e) {
    toast(e.name === "AbortError" || e instanceof TypeError ? "PC에 연결 안 됨 · 집에서 다시" : e.message);
    if (btn) { btn.disabled = false; btn.textContent = "동기화"; }
  } finally { clearTimeout(t); }
}

/* ===================== 설정 / 내보내기 ===================== */
function openSettings() {
  openModal(`<h3 style="margin-top:4px">기본 휴식 시간 (초)</h3>
    <div class="row">${[60, 90, 120, 150].map(s => `<button style="flex:1" class="${DB.settings.rest === s ? "acc" : ""}" onclick="DB.settings.rest=${s};save();openSettings()">${s}</button>`).join("")}</div>
    <h3>데이터</h3>
    <div class="dim small">기록 ${DB.sessions.length}일 · 운동 ${DB.exercises.length}종 · 저장 ${(JSON.stringify(DB).length / 1024).toFixed(1)}KB</div>
    <div class="row mt"><button style="flex:1;color:var(--bad)" onclick="wipe()">전부 삭제</button></div>
    ${""}
    <h3>오프라인</h3><div class="small" id="offl2">확인 중…</div>
    <div class="dim small">"준비 안 됨"이면 크롬 플래그(unsafely-treat-insecure-origin-as-secure)에 이 주소가 등록됐는지 확인 → 크롬 재시작 → 앱 다시 열기</div>
    <div class="dim small mt">v28 · ${location.hostname}</div>`, { head: `<div style="font-size:18px;font-weight:700">설정</div>` });
  offlineStatus().then(t => { const el = $("#offl2"); if (el) el.innerHTML = t; });
}
function wipe() { if (!confirm("모든 기록을 지울까요? 내보내기 먼저 하세요.")) return; localStorage.clear(); location.reload(); }
function exportBlob() { return new Blob([JSON.stringify(DB, null, 1)], { type: "application/json" }); }
function exportName() { return "헬스일지_" + today() + ".json"; }
function exportJSON() {
  const a = document.createElement("a"); a.href = URL.createObjectURL(exportBlob()); a.download = exportName(); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast("다운로드 폴더에 저장");
}
async function shareJSON() {
  try {
    const f = new File([exportBlob()], exportName(), { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: "헬스일지" });
    else exportJSON();
  } catch (e) { }
}
function importJSON() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result); if (!d.sessions) throw 0;
        // 같은 id 는 덮어쓰지 않고 새 것만 추가
        const ids = new Set(DB.sessions.map(s => s.id)); let n = 0;
        for (const s of d.sessions) if (!ids.has(s.id)) { DB.sessions.push(s); n++; }
        for (const e of (d.exercises || [])) if (!DB.exercises.find(x => x.n === e.n)) DB.exercises.push(e);
        save(); toast(n + "일 추가됨"); render();
      } catch (e) { alert("파일 형식이 맞지 않아요"); }
    };
    fr.readAsText(inp.files[0]);
  };
  inp.click();
}

/* ===================== 꾹 누르기 ===================== */
// 요소에 data-hold="함수이름:인자" 를 달면 0.6초 이상 누를 때 그 함수를 부름 (스크롤하면 취소)
let holdT = null, holdFired = false, holdX = 0, holdY = 0;
function holdCancel() { clearTimeout(holdT); holdT = null; }
document.addEventListener("pointerdown", ev => {
  const el = ev.target.closest("[data-hold]"); if (!el) return;
  holdFired = false; holdX = ev.clientX; holdY = ev.clientY;
  holdCancel();
  holdT = setTimeout(() => {
    holdT = null; holdFired = true; vibrate(40);
    const [fn, arg] = el.dataset.hold.split(":");
    setTimeout(() => window[fn](arg), 50); // confirm() 이 포인터 이벤트를 끊지 않게 살짝 뒤에
  }, 600);
}, true);
document.addEventListener("pointermove", ev => {
  if (holdT && Math.hypot(ev.clientX - holdX, ev.clientY - holdY) > 10) holdCancel();
}, true);
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, holdCancel, true));
document.addEventListener("scroll", holdCancel, true);
document.addEventListener("click", ev => { if (holdFired) { ev.stopPropagation(); ev.preventDefault(); holdFired = false; } }, true);
document.addEventListener("contextmenu", ev => { if (ev.target.closest("[data-hold]")) ev.preventDefault(); });
function holdRemoveEntry(i) {
  i = +i; const e = cur.entries[i];
  if (!confirm(`"${e.ex}" 을(를) 오늘 목록에서 뺄까요?`)) return;
  cur.entries.splice(i, 1); saveCur(); renderSession();
}
function holdDeleteSession(id) { deleteSession(id); }

/* ===================== 모달 ===================== */
// openModal(본문, {head: 고정 제목, foot: 고정 하단 버튼들})
function openModal(html, opt = {}) {
  closeModal();
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="box">${opt.head ? `<div class="mhead">${opt.head}</div>` : ""}<div class="mbody">${html}</div>
    <div class="mfoot"><button class="ghost" onclick="closeModal()">닫기</button>${opt.foot || ""}</div></div>`;
  m.addEventListener("click", ev => { if (ev.target === m) closeModal(); });
  document.body.appendChild(m);
}
function closeModal() { const m = $("#modal"); if (m) m.remove(); }

/* ===================== 뒤로가기 ===================== */
// 폰 뒤로가기 = 앱 안에서 한 단계 뒤로 (창/타이머 닫기 → 운동 → 목록 → 홈). 홈에서는 앱이 안 꺼지게 막음.
window.history.pushState({ guard: 1 }, "");
window.addEventListener("popstate", () => {
  if ($("#modal")) closeModal();
  else if (restEnd && restMode === "full" && view === "exercise") restMin();
  else if (view === "exercise") go("session");
  else if (view === "planEdit") { pe = null; go("home"); }
  else if (view === "session" || view === "detail") go("home");
  window.history.pushState({ guard: 1 }, "");
});

/* ===================== 시작 ===================== */
migrateNames();
syncExerciseList();
render();
fetchPlans();
pullExcel();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
</script>
